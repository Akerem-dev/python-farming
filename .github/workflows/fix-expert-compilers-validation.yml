name: Fix expert compilers validator routing

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'stage/44-expert-compilers-metaprogramming'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/fix_expert_compilers_validation.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/content/modules/compilers-metaprogramming.json scripts/fix_expert_compilers_validation.py .github/workflows/fix-expert-compilers-validation.yml
          git commit -m "Route expert compilers tasks through project validation"
          git push
