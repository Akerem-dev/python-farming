name: Materialize Expert Stage 43

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'stage/43-expert-parallelism-systems'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Materialize expert parallelism module
        run: node scripts/materialize-expert-stage43.mjs

      - name: Remove one-time materializer
        run: |
          rm scripts/materialize-expert-stage43.mjs
          rm .github/workflows/materialize-expert-stage43.yml

      - name: Commit product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/content/module-packages.json public/content/modules/parallelism-systems.json scripts/materialize-expert-stage43.mjs .github/workflows/materialize-expert-stage43.yml
          git commit -m "Materialize expert parallelism module" || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
