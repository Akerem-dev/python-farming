name: Diagnose Expert Stage 43

on:
  push:
    branches:
      - stage/43-expert-parallelism-systems

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: stage/43-expert-parallelism-systems
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture frontend diagnostics
        shell: bash
        run: |
          mkdir -p diagnostics
          set +e
          npm run typecheck > diagnostics/stage43-typecheck.log 2>&1
          echo $? > diagnostics/stage43-typecheck.status
          npm test -- --reporter=verbose > diagnostics/stage43-tests.log 2>&1
          echo $? > diagnostics/stage43-tests.status
          set -e

      - name: Remove diagnostic workflow and commit logs
        run: |
          rm .github/workflows/diagnose-stage43.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics .github/workflows/diagnose-stage43.yml
          git commit -m "Capture stage 43 frontend diagnostics" || exit 0
          git push origin HEAD:stage/43-expert-parallelism-systems
