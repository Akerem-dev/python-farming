name: Diagnose expert compilers frontend

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'stage/44-expert-compilers-metaprogramming'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --silent
      - name: Capture complete frontend verification output
        shell: bash
        run: |
          set +e
          npm run verify:frontend > expert-compilers-diagnostic.log 2>&1
          status=$?
          echo "exit_code=$status" >> expert-compilers-diagnostic.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: expert-compilers-diagnostic
          path: expert-compilers-diagnostic.log
          if-no-files-found: error
