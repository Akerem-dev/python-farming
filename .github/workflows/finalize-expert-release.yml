name: Finalize expert release

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'stage/48-expert-release-v1.1.0' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Materialize expert release
        run: node scripts/finalize-expert-release.mjs

      - name: Remove temporary finalizer
        run: |
          rm scripts/finalize-expert-release.mjs
          rm .github/workflows/finalize-expert-release.yml

      - name: Validate generated files
        run: |
          npm ci
          npm run verify:frontend
          cd src-tauri
          cargo fmt --all -- --check
          cargo test --all-targets --locked

      - name: Commit product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore: finalize Python Farming 1.1 expert release"
          git push origin HEAD:${{ github.head_ref }}
