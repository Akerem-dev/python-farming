name: Patch distributed final validator

on:
  push:
    branches:
      - stage/45-expert-distributed-resilience

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: stage/45-expert-distributed-resilience
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply validator-compatible final checks
        run: node scripts/patch-distributed-final.mjs
      - name: Commit product changes and remove temporary tools
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align distributed final with project validator"
          git push origin HEAD:stage/45-expert-distributed-resilience
