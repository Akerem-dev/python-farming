name: Apply stage 38 integration

on:
  push:
    branches:
      - stage/38-portable-python-runtime
    paths:
      - scripts/apply-stage-38.mjs
      - .github/workflows/apply-stage-38.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: stage/38-portable-python-runtime
          fetch-depth: 0

      - name: Remove obsolete patch assertion
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'scripts/apply-stage-38.mjs';
          let value = fs.readFileSync(path, 'utf8');
          value = value.replace('  checklist = replaceExact(checklist, "- dört platform çıktısı", "- dört platform çıktısı", "checklist noop");\n', '');
          fs.writeFileSync(path, value);
          NODE

      - name: Apply integration patch
        run: node scripts/apply-stage-38.mjs

      - name: Check runtime preparer syntax
        run: node --check scripts/prepare-portable-python.mjs

      - name: Format Rust
        run: cargo fmt --all
        working-directory: src-tauri

      - name: Remove one-time integration files
        run: |
          rm scripts/apply-stage-38.mjs
          rm .github/workflows/apply-stage-38.yml

      - name: Commit integrated product code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(runtime): bundle verified portable Python"
          git push origin HEAD:stage/38-portable-python-runtime
