name: Materialize expert compilers content

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'stage/44-expert-compilers-metaprogramming'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/materialize_expert_compilers.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/content/module-packages.json public/content/modules/compilers-metaprogramming.json src/test/content/compilersMetaprogrammingContent.test.ts src/test/integration/expertCompilersProject.integration.test.ts scripts/materialize_expert_compilers.py .github/workflows/materialize-expert-compilers.yml
          git commit -m "Materialize expert compilers curriculum"
          git push
