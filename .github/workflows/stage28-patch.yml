name: Stage 28 Patch

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'stage/28-advanced-databases'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - run: python scripts/stage28_patch.py
      - name: Commit patch and remove temporary tools
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/stage28_patch.py .github/workflows/stage28-patch.yml
          git add public/content/modules/databases-advanced.json
          git commit -m "fix(stage28): satisfy database curriculum structure"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
