name: Patch Stage 31

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'stage/31-advanced-capstone-graduation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/31-advanced-capstone-graduation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply integration patch
        run: python scripts/patch_stage31.py
      - name: Remove temporary tools
        run: rm scripts/patch_stage31.py .github/workflows/patch-stage31.yml
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: connect advanced graduation and validator"
          git push origin HEAD:stage/31-advanced-capstone-graduation
