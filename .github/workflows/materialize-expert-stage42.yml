name: Materialize Expert Stage 42

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'stage/42-expert-algorithms-complexity'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply expert curriculum patch
        run: node scripts/materialize-expert-stage42.mjs

      - name: Remove one-time materializer
        run: |
          rm scripts/materialize-expert-stage42.mjs
          rm .github/workflows/materialize-expert-stage42.yml

      - name: Commit product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/content/curriculum.json src/pages/HomePage/HomePage.tsx scripts/materialize-expert-stage42.mjs .github/workflows/materialize-expert-stage42.yml
          git commit -m "Materialize expert curriculum and roadmap" || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
