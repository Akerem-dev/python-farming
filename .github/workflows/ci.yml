name: CI

on:
  push:
    branches:
      - main
      - "stage/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log

      - name: Upload typecheck diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: error

      - name: Unit and content tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee frontend-tests.log

      - name: Upload frontend test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-diagnostics
          path: frontend-tests.log
          if-no-files-found: error

      - name: Production frontend build
        run: npm run build

  browser-journeys:
    name: Browser user journeys
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real navigation journeys
        run: npm run test:e2e

  rust-format:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check rustfmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check

  rust-runtime:
    name: Rust runtime tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            build-essential \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev >/dev/null

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Run locked Rust tests
        working-directory: src-tauri
        run: cargo test --all-targets --locked -q

  tauri-bundle-smoke:
    name: Linux Tauri bundle smoke
    needs:
      - frontend
      - browser-journeys
      - rust-runtime
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux bundle dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            build-essential \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils >/dev/null

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install locked dependencies
        run: npm ci

      - name: Build Debian bundle with portable Python
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHON_FARMING_RUNTIME_TARGET: x86_64-unknown-linux-gnu
        run: npm run tauri:build -- --bundles deb

      - name: Verify Debian artifact and embedded Python
        shell: bash
        run: |
          shopt -s nullglob
          bundles=(src-tauri/target/release/bundle/deb/*.deb)
          if [ "${#bundles[@]}" -ne 1 ]; then
            echo "Expected exactly one .deb bundle, found ${#bundles[@]}."
            exit 1
          fi
          test -s "${bundles[0]}"
          extract_dir="${RUNNER_TEMP}/python-farming-deb"
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          dpkg-deb -x "${bundles[0]}" "$extract_dir"
          manifest="$(find "$extract_dir" -type f -path '*/python-runtime/runtime-manifest.json' -print -quit)"
          test -s "$manifest"
          relative="$(node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const value = manifest.executableRelativePath;
            if (typeof value !== "string" || !value || value.startsWith("/") || value.split(/[\\/]+/).some((part) => !part || part === "." || part === "..")) {
              process.exit(2);
            }
            process.stdout.write(value);
          ' "$manifest")"
          runtime_root="$(realpath "$(dirname "$manifest")")"
          runtime="$(realpath -m "$runtime_root/$relative")"
          case "$runtime" in
            "$runtime_root"/*) ;;
            *) echo "Runtime path escaped resource root: $runtime"; exit 1 ;;
          esac
          test -x "$runtime"
          "$runtime" -I -X utf8 -c "import asyncio, json, sqlite3; print('portable-runtime-ok')"
          echo "Verified bundle and portable runtime: ${bundles[0]} ($relative)"
