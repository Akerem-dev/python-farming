name: CI

on:
  push:
    branches:
      - main
      - "stage/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # STAGE38_APPLY_START
  apply-stage-38:
    name: Apply stage 38 integration
    if: github.event_name == 'pull_request' && github.head_ref == 'stage/38-portable-python-runtime'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply remaining product patch
        shell: bash
        run: |
          if [ -f scripts/apply-stage-38-remaining.mjs ]; then
            sed -i '/await patchWorkflows();/d' scripts/apply-stage-38-remaining.mjs
            node scripts/apply-stage-38-remaining.mjs
          else
            echo "Stage 38 product patch already applied."
          fi

      - name: Validate preparer syntax
        run: node --check scripts/prepare-portable-python.mjs

      - name: Format Rust
        working-directory: src-tauri
        run: cargo fmt --all

      - name: Remove one-time non-workflow scripts
        run: |
          rm -f scripts/apply-stage-38.mjs
          rm -f scripts/apply-stage-38-remaining.mjs

      - name: Commit integrated product code when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No integration changes remain."
            exit 0
          fi
          git commit -m "feat(runtime): bundle verified portable Python"
          git push origin HEAD:${{ github.head_ref }}
  # STAGE38_APPLY_END

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Frontend quality gate
        run: npm run verify:frontend

  rust-format:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check rustfmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check

  rust-runtime:
    name: Rust runtime tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            build-essential \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev >/dev/null

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Run locked Rust tests
        working-directory: src-tauri
        run: cargo test --all-targets --locked -q

  tauri-bundle-smoke:
    name: Linux Tauri bundle smoke
    needs:
      - frontend
      - rust-runtime
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux bundle dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            build-essential \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils >/dev/null

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install locked dependencies
        run: npm ci

      - name: Build Debian bundle
        run: npm run tauri:build -- --bundles deb

      - name: Verify Debian artifact
        shell: bash
        run: |
          shopt -s nullglob
          bundles=(src-tauri/target/release/bundle/deb/*.deb)
          if [ "${#bundles[@]}" -ne 1 ]; then
            echo "Expected exactly one .deb bundle, found ${#bundles[@]}."
            exit 1
          fi
          test -s "${bundles[0]}"
          echo "Verified bundle: ${bundles[0]}"
