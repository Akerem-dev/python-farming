name: CI

on:
  push:
    branches:
      - main
      - "stage/**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfiles:
    name: Generate deterministic lockfiles
    if: >-
      github.actor != 'github-actions[bot]' &&
      ((github.event_name == 'pull_request' && github.head_ref == 'stage/32-release-readiness') ||
      (github.event_name == 'push' && github.ref_name == 'stage/32-release-readiness'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release-readiness branch
        uses: actions/checkout@v7
        with:
          ref: stage/32-release-readiness

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Generate Cargo lockfile
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Activate locked CI configuration
        run: |
          cp scripts/ci-stage32-final.yml .github/workflows/ci.yml
          rm scripts/ci-stage32-final.yml

      - name: Commit lockfiles and final CI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock .github/workflows/ci.yml scripts/ci-stage32-final.yml
          git commit -m "build: lock npm and Cargo dependencies"
          git push origin HEAD:stage/32-release-readiness

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Frontend quality gate
        run: npm run verify:frontend

  rust-format:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check rustfmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check

  rust-runtime:
    name: Rust runtime tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            build-essential \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev >/dev/null

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --all-targets -q
