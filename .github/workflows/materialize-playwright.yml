name: Materialize Playwright dependency

on:
  push:
    branches:
      - stage/49-user-journey-regression

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: stage/49-user-journey-regression
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Playwright test runner
        run: npm install --save-dev @playwright/test

      - name: Validate Playwright test discovery
        run: npm run test:e2e -- --list

      - name: Remove temporary workflow
        run: rm .github/workflows/materialize-playwright.yml

      - name: Commit locked dependency
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/materialize-playwright.yml
          git commit -m "test: lock Playwright browser regression dependency"
          git push origin HEAD:stage/49-user-journey-regression
