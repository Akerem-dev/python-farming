name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.versions.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate manifest versions and triggering tag
        id: versions
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(sed -n '0,/^version = /s/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml)"

          if [ "$package_version" != "$tauri_version" ] || [ "$package_version" != "$cargo_version" ]; then
            echo "Version mismatch: package=$package_version tauri=$tauri_version cargo=$cargo_version"
            exit 1
          fi

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            expected_tag="v${package_version}"
            if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
              echo "Tag $GITHUB_REF_NAME does not match application version $expected_tag."
              exit 1
            fi
          fi

          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            build-essential \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils >/dev/null

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run complete quality gate
        run: npm run verify

  build:
    name: Build ${{ matrix.label }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS Apple Silicon
            args: --target aarch64-apple-darwin
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
            runtimeTarget: aarch64-apple-darwin
            bundleRoot: src-tauri/target/aarch64-apple-darwin/release/bundle
          - platform: macos-latest
            label: macOS Intel
            args: --target x86_64-apple-darwin
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
            runtimeTarget: x86_64-apple-darwin
            bundleRoot: src-tauri/target/x86_64-apple-darwin/release/bundle
          - platform: ubuntu-22.04
            label: Linux x64
            args: ""
            rustTargets: ""
            runtimeTarget: x86_64-unknown-linux-gnu
            bundleRoot: src-tauri/target/release/bundle
          - platform: windows-latest
            label: Windows x64
            args: ""
            rustTargets: ""
            runtimeTarget: x86_64-pc-windows-msvc
            bundleRoot: src-tauri/target/release/bundle

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            build-essential \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils >/dev/null

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build dry-run Tauri bundles
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHON_FARMING_RUNTIME_TARGET: ${{ matrix.runtimeTarget }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos') && '-' || '' }}
        run: npm run tauri:build -- ${{ matrix.args }}

      - name: Build and upload tagged Tauri release
        if: github.ref_type == 'tag'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHON_FARMING_RUNTIME_TARGET: ${{ matrix.runtimeTarget }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos') && '-' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Python Farming ${{ github.ref_name }}
          releaseBody: |
            Python Farming ${{ github.ref_name }} paketleri.

            Paketler taşınabilir Python çalışma zamanı içerir. Windows paketi imzasızdır; macOS paketleri ad-hoc imzalıdır ve notarize edilmemiştir. Yayın taslak olarak oluşturulur ve RELEASE_CHECKLIST.md tamamlanmadan son kullanıcıya açılmamalıdır.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.args }}

      - name: Create SHA-256 release manifest
        shell: bash
        run: |
          npm run release:manifest -- \
            --root "${{ matrix.bundleRoot }}" \
            --platform "${{ matrix.runtimeTarget }}" \
            --version "${{ needs.preflight.outputs.version }}" \
            --output "release-manifests/${{ matrix.runtimeTarget }}.json"

      - name: Upload dry-run bundles and manifest
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: python-farming-${{ matrix.runtimeTarget }}-${{ needs.preflight.outputs.version }}
          if-no-files-found: error
          path: |
            ${{ matrix.bundleRoot }}/**/*
            release-manifests/${{ matrix.runtimeTarget }}.json

      - name: Attach manifest to tagged draft release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "release-manifests/${{ matrix.runtimeTarget }}.json" --clobber
