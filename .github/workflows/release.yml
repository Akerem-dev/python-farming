name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Preview paketleri oluştur"
        required: true
        default: preview
        type: choice
        options:
          - preview
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-22.04
    outputs:
      production: ${{ steps.mode.outputs.production }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release channel
        id: mode
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "production=true" >> "$GITHUB_OUTPUT"
          else
            echo "production=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate manifest versions and triggering tag
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(sed -n '0,/^version = /s/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml)"

          if [ "$package_version" != "$tauri_version" ] || [ "$package_version" != "$cargo_version" ]; then
            echo "Version mismatch: package=$package_version tauri=$tauri_version cargo=$cargo_version"
            exit 1
          fi

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            expected_tag="v${package_version}"
            if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
              echo "Tag $GITHUB_REF_NAME does not match application version $expected_tag."
              exit 1
            fi
          fi

      - name: Require updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "TAURI_SIGNING_PRIVATE_KEY secret is required."; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret is required."; exit 1; }

      - name: Require production platform signing identities
        if: steps.mode.outputs.production == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          missing=0
          for name in WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing production signing secret: $name"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            build-essential \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils >/dev/null

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run complete quality gate
        run: npm run verify

  publish:
    name: Build ${{ matrix.label }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS Apple Silicon
            args: --target aarch64-apple-darwin
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
            runtimeTarget: aarch64-apple-darwin
          - platform: macos-latest
            label: macOS Intel
            args: --target x86_64-apple-darwin
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
            runtimeTarget: x86_64-apple-darwin
          - platform: ubuntu-22.04
            label: Linux x64
            args: ""
            rustTargets: ""
            runtimeTarget: x86_64-unknown-linux-gnu
          - platform: windows-latest
            label: Windows x64
            args: ""
            rustTargets: ""
            runtimeTarget: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            build-essential \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils >/dev/null

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Import Windows production certificate
        id: windows-signing
        if: matrix.platform == 'windows-latest' && needs.preflight.outputs.production == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "python-farming-code-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate.Thumbprint) { throw "Windows certificate could not be imported." }
          $config = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          }
          $config | ConvertTo-Json -Depth 6 | Set-Content -Path src-tauri/tauri.windows-signing.conf.json -Encoding UTF8
          "config_args=--config src-tauri/tauri.windows-signing.conf.json" >> $env:GITHUB_OUTPUT

      - name: Build, sign and upload Tauri bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHON_FARMING_RUNTIME_TARGET: ${{ matrix.runtimeTarget }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ needs.preflight.outputs.production == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ needs.preflight.outputs.production == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ needs.preflight.outputs.production == 'true' && secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_ID: ${{ needs.preflight.outputs.production == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ needs.preflight.outputs.production == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ needs.preflight.outputs.production == 'true' && secrets.APPLE_TEAM_ID || '' }}
        with:
          tagName: ${{ needs.preflight.outputs.production == 'true' && github.ref_name || format('v__VERSION__-preview-{0}', github.run_number) }}
          releaseName: ${{ needs.preflight.outputs.production == 'true' && 'Python Farming v__VERSION__' || format('Python Farming v__VERSION__ Preview {0}', github.run_number) }}
          releaseBody: |
            Python Farming masaüstü sürümü.

            Paketler gömülü Python runtime içerir. Güncelleme artifact'ları Tauri updater anahtarıyla imzalanır. Production etiketi Windows kod imzası ve macOS notarizasyon sırları olmadan yayınlanamaz.
          releaseDraft: ${{ needs.preflight.outputs.production != 'true' }}
          prerelease: ${{ needs.preflight.outputs.production != 'true' }}
          generateReleaseNotes: true
          args: ${{ matrix.args }} ${{ steps.windows-signing.outputs.config_args }}

      - name: Verify updater artifacts and signatures
        shell: bash
        run: |
          mapfile -t signatures < <(find src-tauri/target -type f -name '*.sig' -print)
          if [ "${#signatures[@]}" -lt 1 ]; then
            echo "No signed updater artifact was generated for ${{ matrix.label }}."
            exit 1
          fi
          for signature in "${signatures[@]}"; do
            test -s "$signature"
            test -s "${signature%.sig}"
          done
          printf 'Verified updater signatures:\n%s\n' "${signatures[*]}"

      - name: Verify Windows Authenticode signatures
        if: matrix.platform == 'windows-latest' && needs.preflight.outputs.production == 'true'
        shell: pwsh
        run: |
          $bundles = Get-ChildItem src-tauri/target/release/bundle -Recurse -File | Where-Object { $_.Extension -in '.exe', '.msi' }
          if (-not $bundles) { throw "No Windows installers were produced." }
          foreach ($bundle in $bundles) {
            $signature = Get-AuthenticodeSignature $bundle.FullName
            if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature: $($bundle.FullName) ($($signature.Status))" }
          }

      - name: Verify macOS signature and notarization
        if: startsWith(matrix.platform, 'macos') && needs.preflight.outputs.production == 'true'
        shell: bash
        run: |
          app="$(find src-tauri/target -type d -name 'Python Farming.app' -print -quit)"
          test -d "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
