name: Stage 40 documentation patch

on:
  push:
    branches:
      - stage/40-cross-platform-release-updates
    paths:
      - ".github/workflows/stage40-docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: stage/40-cross-platform-release-updates
      - run: node scripts/apply-stage40-docs.mjs
      - run: |
          git rm scripts/apply-stage40-docs.mjs .github/workflows/stage40-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/RELEASE_CHECKLIST.md \
            src/test/content/portablePythonRuntime.test.ts \
            src/test/content/runtimeIsolation.test.ts
          git commit -m "docs: document signed updater release flow"
          git push origin HEAD:stage/40-cross-platform-release-updates
