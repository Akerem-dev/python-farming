name: Patch expert graduation home

on:
  push:
    branches:
      - stage/47-expert-capstone-graduation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: stage/47-expert-capstone-graduation
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/patch-expert-graduation-home.mjs
      - name: Commit expert graduation UI and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: show expert graduation and curriculum completion"
          git push origin HEAD:stage/47-expert-capstone-graduation
