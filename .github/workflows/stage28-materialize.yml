name: Stage 28 Materialize

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'stage/28-advanced-databases'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Materialize database module
        run: python scripts/stage28_materialize.py
      - name: Commit generated module and remove temporary tools
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/stage28_materialize.py .github/workflows/stage28-materialize.yml
          git add public/content/modules/databases-advanced.json
          git commit -m "feat(stage28): add advanced database curriculum"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
