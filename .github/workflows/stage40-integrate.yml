name: Stage 40 updater integration

on:
  push:
    branches:
      - stage/40-cross-platform-release-updates
    paths:
      - ".github/workflows/stage40-integrate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: stage/40-cross-platform-release-updates
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply integration
        run: |
          node scripts/apply-stage40-updater-integration.mjs
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
      - name: Commit product integration
        run: |
          git rm scripts/apply-stage40-updater-integration.mjs .github/workflows/stage40-integrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/SettingsPage/SettingsPage.tsx \
            src/pages/SettingsPage/SettingsPage.module.css \
            src-tauri/src/lib.rs src-tauri/capabilities/default.json
          git commit -m "feat: integrate signed application updater"
          git push origin HEAD:stage/40-cross-platform-release-updates
