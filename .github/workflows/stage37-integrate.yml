name: Stage 37 integration

on:
  push:
    branches:
      - stage/37-data-export-import-reset

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: stage/37-data-export-import-reset
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply integration patch
        run: node scripts/apply-stage37-integration.mjs
      - name: Format Rust
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml
      - name: Remove temporary integration files
        run: rm scripts/apply-stage37-integration.mjs .github/workflows/stage37-integrate.yml
      - name: Commit integrated product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md src src-tauri scripts .github/workflows
          git commit -m "feat: integrate progress portability settings"
          git push origin HEAD:stage/37-data-export-import-reset
