name: Capture frontend failure

on:
  push:
    branches:
      - stage/45-expert-distributed-resilience

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: stage/45-expert-distributed-resilience
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Capture full frontend output
        shell: bash
        run: |
          set +e
          npm run verify:frontend > frontend-failure.log 2>&1
          status=$?
          echo "EXIT_STATUS=$status" >> frontend-failure.log
          rm .github/workflows/capture-frontend-failure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-failure.log .github/workflows/capture-frontend-failure.yml
          git commit -m "chore: capture frontend failure diagnostics"
          git push origin HEAD:stage/45-expert-distributed-resilience
