name: Stage 29 Materialize
on:
  push:
    branches: [stage/29-advanced-design-patterns]
permissions:
  contents: write
jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[stage29-materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/29-advanced-design-patterns
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/stage29_materialize.py
      - run: |
          rm scripts/stage29_materialize.py
          rm .github/workflows/stage29-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/content/modules/architecture-patterns.json scripts/stage29_materialize.py .github/workflows/stage29-materialize.yml
          git commit -m "feat(curriculum): materialize architecture patterns [stage29-materialized]"
          git push
