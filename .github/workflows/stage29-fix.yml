name: Stage 29 Fix
on:
  push:
    branches: [stage/29-advanced-design-patterns]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[stage29-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/29-advanced-design-patterns
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/stage29_fix.py
      - run: |
          rm scripts/stage29_fix.py
          rm .github/workflows/stage29-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/content/modules/architecture-patterns.json scripts/stage29_fix.py .github/workflows/stage29-fix.yml
          git commit -m "fix(content): complete architecture debugging guide [stage29-fixed]"
          git push
