name: Finalize v1 pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: finalize-v1-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    name: Materialize and verify 1.0.0
    if: github.head_ref == 'stage/41-final-qa-v1'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout final branch
        uses: actions/checkout@v7
        with:
          ref: stage/41-final-qa-v1
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Extract and run deterministic finalizer
        id: materialize
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/finalize-v1.yml').read_text(encoding='utf-8').splitlines()
          start_marker = "          node --input-type=module <<'NODE'"
          end_marker = "          NODE"
          try:
              start = source.index(start_marker) + 1
              end = source.index(end_marker, start)
          except ValueError as error:
              raise SystemExit(f'Finalizer Node bölümü bulunamadı: {error}')

          lines = []
          for line in source[start:end]:
              if line.startswith('          '):
                  line = line[10:]
              lines.append(line)
          Path('/tmp/finalize-v1.mjs').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          set +e
          node /tmp/finalize-v1.mjs > /tmp/finalizer.log 2>&1
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            mkdir -p docs
            cp /tmp/finalizer.log docs/FINALIZER_ERROR.log
            echo "success=false" >> "$GITHUB_OUTPUT"
          else
            rm -f .github/workflows/finalize-v1-pr.yml
            echo "success=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit finalizer diagnostics
        if: steps.materialize.outputs.success == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/FINALIZER_ERROR.log
          git commit -m "Aşama 41: finalizer tanılama çıktısı [finalize-v1-diagnostic]"
          git push origin HEAD:stage/41-final-qa-v1

      - name: Stop after recorded finalizer failure
        if: steps.materialize.outputs.success == 'false'
        run: exit 1

      - name: Install locked dependencies
        if: steps.materialize.outputs.success == 'true'
        run: npm ci

      - name: Run complete quality gate
        if: steps.materialize.outputs.success == 'true'
        run: npm run verify

      - name: Commit finalized v1 files
        if: steps.materialize.outputs.success == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Aşama 41: Final QA ve 1.0 sürüm hazırlığı [finalize-v1]"
          git push origin HEAD:stage/41-final-qa-v1
