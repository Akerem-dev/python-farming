name: Finalize v1 pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: finalize-v1-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    name: Materialize and verify 1.0.0
    if: github.head_ref == 'stage/41-final-qa-v1'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout final branch
        uses: actions/checkout@v7
        with:
          ref: stage/41-final-qa-v1
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Extract and run deterministic finalizer
        id: materialize
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/finalize-v1.yml').read_text(encoding='utf-8').splitlines()
          start_marker = "          node --input-type=module <<'NODE'"
          end_marker = "          NODE"
          try:
              start = source.index(start_marker) + 1
              end = source.index(end_marker, start)
          except ValueError as error:
              raise SystemExit(f'Finalizer Node bölümü bulunamadı: {error}')

          lines = []
          for line in source[start:end]:
              if line.startswith('          '):
                  line = line[10:]
              lines.append(line)

          script = '\n'.join(lines) + '\n'
          unsafe = 'expect(workflow).toContain("tagName: $' + '{{ github.ref_name }}");'
          safe = 'expect(workflow).toContain("tagName: $" + "{{ github.ref_name }}");'
          if unsafe not in script:
              raise SystemExit('Final test içindeki GitHub ifade satırı bulunamadı.')
          script = script.replace(unsafe, safe)
          manifest_unsafe = 'expect(workflow).toContain("release-manifest.json");'
          manifest_safe = 'expect(workflow).toContain("release-manifests/");'
          if manifest_unsafe not in script:
              raise SystemExit('Final test içindeki release manifest beklentisi bulunamadı.')
          script = script.replace(manifest_unsafe, manifest_safe)
          Path('/tmp/finalize-v1.mjs').write_text(script, encoding='utf-8')
          PY

          set +e
          node /tmp/finalize-v1.mjs > /tmp/finalizer.log 2>&1
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            echo "success=false" >> "$GITHUB_OUTPUT"
          else
            rm -f .github/workflows/finalize-v1-pr.yml
            echo "success=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload finalizer diagnostics
        if: steps.materialize.outputs.success == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: finalizer-error
          path: /tmp/finalizer.log
          if-no-files-found: error
          retention-days: 1

      - name: Stop after recorded finalizer failure
        if: steps.materialize.outputs.success == 'false'
        run: exit 1

      - name: Install locked dependencies
        if: steps.materialize.outputs.success == 'true'
        run: npm ci

      - name: Run complete quality gate
        id: quality
        if: steps.materialize.outputs.success == 'true'
        shell: bash
        run: |
          set +e
          npm run verify > /tmp/final-quality.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload final quality diagnostics
        if: steps.quality.outputs.success == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: final-quality-error
          path: /tmp/final-quality.log
          if-no-files-found: error
          retention-days: 1

      - name: Stop after recorded quality failure
        if: steps.quality.outputs.success == 'false'
        run: exit 1

      - name: Commit finalized v1 files
        if: steps.materialize.outputs.success == 'true' && steps.quality.outputs.success == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Aşama 41: Final QA ve 1.0 sürüm hazırlığı [finalize-v1]"
          git push origin HEAD:stage/41-final-qa-v1
