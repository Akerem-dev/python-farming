name: Materialize security observability module

on:
  push:
    branches:
      - stage/46-expert-security-observability

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: stage/46-expert-security-observability
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/materialize-security-observability.mjs
      - name: Commit module package and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add expert security and observability module"
          git push origin HEAD:stage/46-expert-security-observability
