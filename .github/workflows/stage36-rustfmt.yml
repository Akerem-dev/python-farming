name: Stage 36 Rustfmt

on:
  push:
    branches:
      - stage/36-backup-restore-delete

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: stage/36-backup-restore-delete
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri
          git commit -m "style: format stage 36 Rust changes"
          git push origin HEAD:stage/36-backup-restore-delete
